<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <!-- スマホでも画面の幅に合わせて表示するための指定 -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>よけるゲーム 3D</title>
  <style>
    /* ページ全体の見た目 */
    body {
      background: #222;      /* 背景を濃いグレーに */
      display: flex;         /* 中身を中央に縦に並べるための指定 */
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin: 0;
      padding: 24px 16px;    /* 上下24px・左右16pxのすき間 */
      font-family: sans-serif;
    }

    /* ゲーム画面の入れ物。3Dの絵と、スコアなどの文字を重ねて置く */
    #game-area {
      position: relative;    /* 中の文字を、この箱を基準に重ねて置けるようにする */
      width: 400px;
      max-width: 100%;       /* スマホなど狭い画面では、はみ出さないよう縮める */
      aspect-ratio: 2 / 3;   /* 縦横の比率を 2:3（400×600 と同じ）に保つ */
      border: 2px solid #888; /* 境目が分かるように枠線をつける */
      overflow: hidden;
      touch-action: none;    /* タップしたとき画面がスクロールや拡大をしないようにする */
      user-select: none;     /* 長押しで文字選択などが出ないようにする */
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    /* Three.js が作る3Dの絵（canvas）を、入れ物いっぱいに広げる */
    #game-area canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* 左上のスコア */
    #score {
      position: absolute;    /* 入れ物の中で、場所を指定して重ねる */
      top: 10px;
      left: 12px;
      color: #fff;
      font-size: 20px;
      font-weight: bold;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6); /* 背景が明るくても読めるように影をつける */
      pointer-events: none;  /* 文字がタップの邪魔をしないようにする */
    }

    /* スマホ用のバーチャルスティック（指を置いた場所に出る丸） */
    #stick {
      position: absolute;
      width: 96px;
      height: 96px;
      margin: -48px 0 0 -48px; /* 指の位置が丸の中心になるようにずらす */
      border-radius: 50%;    /* 角を丸めて円にする */
      border: 2px solid rgba(255, 255, 255, 0.8);
      background: rgba(255, 255, 255, 0.15);
      pointer-events: none;
    }
    #stick[hidden] {
      display: none;
    }
    /* スティックの中の、指についてくる小さな丸 */
    #stick-knob {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 40px;
      height: 40px;
      margin: -20px 0 0 -20px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.85);
    }

    /* おじゃま牛の吹き出し（牛の頭の上に出る） */
    #cow-bubble {
      position: absolute;
      transform: translate(-50%, -100%); /* 指定した位置の真上に、まん中をそろえて出す */
      padding: 4px 10px;
      border-radius: 12px;
      background: #fff;
      color: #222;
      font-size: 18px;
      font-weight: bold;
      white-space: nowrap;   /* 途中で改行しない */
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
      pointer-events: none;
    }
    #cow-bubble[hidden] {
      display: none;
    }
    /* 着地したときに、吹き出しをポンと大きくしてから戻す */
    #cow-bubble.pop {
      animation: bubble-pop 0.35s ease-out;
    }
    @keyframes bubble-pop {
      0%   { transform: translate(-50%, -100%) scale(0.6); }
      60%  { transform: translate(-50%, -100%) scale(1.2); }
      100% { transform: translate(-50%, -100%) scale(1); }
    }
    /* 「動きを減らす」設定にしている人には、ポンと動かさない */
    @media (prefers-reduced-motion: reduce) {
      #cow-bubble.pop {
        animation: none;
      }
    }

    /* カメラの回転を止める・回すボタン */
    #camera-toggle {
      font-size: 16px;
      padding: 10px 18px;
      border: 2px solid #888;
      border-radius: 8px;
      background: #333;
      color: #fff;
    }
    #camera-toggle:focus-visible {
      outline: 3px solid #5fb0ff; /* キーボードで選んだときに分かるように枠を出す */
    }

    /* バージョン番号 */
    #version {
      color: #aaa;
      font-size: 13px;
    }

    /* ゲームオーバー画面（最初は隠しておく） */
    #game-over {
      position: absolute;
      inset: 0;              /* 入れ物いっぱいに広げる */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: rgba(0, 0, 0, 0.6); /* 半透明の黒で少し暗くする */
      color: #fff;
      text-align: center;
      pointer-events: none;
    }
    #game-over[hidden] {
      display: none;         /* hidden がついている間は表示しない */
    }
    #game-over .title {
      font-size: 44px;
      font-weight: bold;
    }
    #game-over .final-score {
      font-size: 28px;
      font-weight: bold;
    }
    #game-over .retry {
      font-size: 18px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <!-- ゲーム画面。3Dの絵（canvas）は game.js がこの中に入れる -->
  <div id="game-area">
    <div id="score">スコア: 0</div>
    <div id="stick" hidden><div id="stick-knob"></div></div>
    <div id="cow-bubble" hidden></div>
    <div id="game-over" hidden>
      <div class="title">GAME OVER</div>
      <div class="final-score" id="final-score">スコア: 0</div>
      <div class="retry" id="retry-message" hidden>タップ または スペースキーで<br>もう一度遊ぶ</div>
    </div>
  </div>

  <!-- カメラの回転を止める・回すボタン（パソコンでは C キーでも切りかえられる） -->
  <button id="camera-toggle" type="button">カメラの回転を止める</button>

  <!-- 今どの版を見ているか分かるように表示する（上の ?v= と同じ番号にする） -->
  <div id="version">バージョン 14</div>

  <!-- 3Dの絵を描くためのライブラリ Three.js を読み込む（先に読み込む必要がある） -->
  <script src="lib/three.min.js"></script>
  <!-- ゲームのプログラムを読み込む -->
  <!-- ?v= のあとの番号はバージョン。変更するたびに増やす -->
  <!-- 番号が変わると、ブラウザは古いファイルを使い回さず、新しく読み込む -->
  <script src="game.js?v=14"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <!-- スマホでも画面の幅に合わせて表示するための指定 -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>よけるゲーム</title>
  <style>
    /* ページ全体の見た目 */
    body {
      background: #222;      /* 背景を濃いグレーに */
      display: flex;         /* 中身を中央に並べるための指定 */
      justify-content: center;
      margin: 0;
      padding: 24px 16px;    /* 上下24px・左右16pxのすき間 */
    }
    /* ゲーム画面（キャンバス）の見た目 */
    canvas {
      background: #fff;      /* キャンバスの中は白 */
      border: 2px solid #888; /* 境目が分かるように枠線をつける */
      max-width: 100%;       /* スマホなど狭い画面では、はみ出さないよう縮める */
      height: auto;          /* 縮めても縦横の比率を保つ */
      touch-action: none;    /* タップしたとき画面がスクロールや拡大をしないようにする */
      user-select: none;     /* 長押しで文字選択などが出ないようにする */
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
  </style>
</head>
<body>
  <!-- ステップ1：ゲーム画面となる「画用紙」。幅400 × 高さ600 ピクセル -->
  <canvas id="game" width="400" height="600"></canvas>

  <!-- ゲームのプログラムを読み込む -->
  <script src="game.js"></script>
</body>
</html>
